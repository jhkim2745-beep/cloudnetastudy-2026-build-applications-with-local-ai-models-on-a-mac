<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="860" height="300" fill="#ffffff"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <text x="30" y="34" font-size="16" font-weight="700" fill="#0f172a">messages 리스트 (ollama.chat에 매번 전체 전달)</text>
  <rect x="30" y="52" width="520" height="40" rx="8" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="45" y="77" font-size="13" fill="#5b21b6" font-family="Menlo, monospace">system</text>
  <text x="140" y="77" font-size="13" fill="#0f172a">AI의 역할·어조·규칙 (대화 시작 전에 한 번)</text>
  <rect x="30" y="102" width="520" height="40" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="45" y="127" font-size="13" fill="#1d4ed8" font-family="Menlo, monospace">user</text>
  <text x="140" y="127" font-size="13" fill="#0f172a">사람의 질문·요청</text>
  <rect x="30" y="152" width="520" height="40" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="45" y="177" font-size="13" fill="#047857" font-family="Menlo, monospace">assistant</text>
  <text x="140" y="177" font-size="13" fill="#0f172a">AI의 이전 응답 (맥락 유지용)</text>
  <rect x="30" y="202" width="520" height="40" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-dasharray="5 4"/>
  <text x="45" y="227" font-size="13" fill="#1d4ed8" font-family="Menlo, monospace">user</text>
  <text x="140" y="227" font-size="13" fill="#0f172a">새 질문 → 리스트에 추가 후 전송</text>
  <line x1="552" y1="147" x2="640" y2="147" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <rect x="645" y="100" width="190" height="95" rx="12" fill="#f8fafc" stroke="#334155"/>
  <text x="740" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">LLM</text>
  <text x="740" y="158" text-anchor="middle" font-size="12" fill="#64748b">기억 없음</text>
  <text x="740" y="177" text-anchor="middle" font-size="12" fill="#64748b">매번 전체를 다시 읽음</text>
  <text x="430" y="285" text-anchor="middle" font-size="12" fill="#64748b">그림 1. 세 가지 메시지 역할과 대화 기록 전달 방식 (직접 작성)</text>
</svg>
